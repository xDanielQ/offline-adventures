[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "offline-adventures"
version = "0.1.0"
description = "A local-first AI activity planner that helps people spend less time choosing and more time doing."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Tymoszuk" }
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "streamlit>=1.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[project.urls]
Repository = "https://github.com/xDanielQ/offline-adventures"

